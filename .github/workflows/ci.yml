name: smoke

# Fast unit tests of the shared last-crossing code and the Ras TPT solver.
# Does not run the heavy sweeps.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib pytest
      - name: Revision tests
        run: |
          cd common && python -m pytest -q test_exact_last_crossing.py && cd ..
          cd ras/code && python -m pytest -q test_current_analysis.py
